buildscript {
    repositories {
        mavenCentral()
        google()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
    }
}

allprojects {
    repositories {
        mavenCentral()
        google()
        maven { url = "https://jitpack.io" }
    }

    // tasks.withType(JavaCompile) {
    //     options.deprecation = true
    // }
}

apply plugin: 'com.android.application'

android {
    compileSdkVersion 35
    namespace = "org.billthefarmer.diary"

    defaultConfig {
        applicationId "org.billthefarmer.diary"
        minSdkVersion 21
        targetSdkVersion 28
        versionName "1.105"
        versionCode 1105

        buildConfigField "long", "BUILT", System.currentTimeMillis() + "L"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        buildConfig = true
    }

    lintOptions {
    	disable 'ScopedStorage', 'NonConstantResourceId', 'AndroidGradlePluginVersion',
	'GradleDependency', 'SwitchIntDef', 'SetJavaScriptEnabled',
	'ExpiredTargetSdkVersion', 'ContentDescription'
        // abortOnError false
    }
}

dependencies {
    implementation 'org.commonmark:commonmark-ext-yaml-front-matter:0.32.0'
    implementation 'com.github.billthefarmer:CustomCalendarView:v1.06'
    implementation 'com.github.billthefarmer:MarkdownView:v1.12'
    implementation 'org.commonmark:commonmark:0.32.0'
}
